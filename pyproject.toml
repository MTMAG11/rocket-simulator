[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-simulator"
version = "0.1.0"
description = "Simulation environment for an autonomous rocket guidance, navigation, and control system"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "jupyter",
    "rocketpy",
    "Ruff",
    "Black",
    "Pytest",
]

[tool.setuptools.packages.find]
where = ["src"]