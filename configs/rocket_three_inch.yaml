# Three-inch rocket: a wide, sturdy rocket with a 29 mm engine in the middle. Illustrative numbers, not a real kit.
config_version: 1
name: rocket_three_inch
fidelity: 3
simulation: {dt_s: 0.01, descent_dt_s: 0.05, t_max_s: 400, integrator: rk4}
rocket:
  name: Three-inch rocket
  body_diameter_m: 0.079
  body_length_m: 1.00
  nose: {shape: ogive, length_m: 0.25}
  fins: {count: 4, root_chord_m: 0.14, tip_chord_m: 0.06, span_m: 0.09, sweep_m: 0.07, thickness_m: 0.003, position_from_nose_m: 0.84}
  dry_mass_kg: 0.55
  cg_from_nose_m: 0.58
  parachutes:
    - {cd: 1.5, diameter_m: 0.76, trigger: apogee, delay_s: 0.0}
motor:
  file: data/motors/AeroTech_G40W.eng
environment:
  atmosphere: {model: isa}
  gravity: {model: inverse_square}
  wind: {model: constant, speed_ms: 3.0, direction_from_deg: 270}
launch: {elevation_deg: 90, azimuth_deg: 0, rail_length_m: 1.5}
