# Domain-randomised ML dataset (V1.1): every randomised quantity, its distribution, and its dependence structure is
# declared here and stored verbatim in the dataset manifest. Run:
#   rocketsim generate-dataset configs/domain_randomization.yaml --runs 60
#
# Design rules (see docs/datasets.md):
#  * explicit marginals (normal / truncnormal / uniform / lognormal / choice); nothing is randomised implicitly;
#  * physically linked quantities are NOT sampled independently: inertia follows the sampled mass (`linked`), air
#    temperature and ground pressure are correlated (Gaussian copula), wind turbulence grows with mean wind;
#  * sensor imperfections are randomised per flight (noise, bias, misalignment, GPS dropout / start-up delay);
#  * splits are whole flights with disjoint seed namespaces; `test` is drawn from a SHIFTED distribution.
name: dr-demo
base_config: example_g80.yaml
master_seed: 20261004
shard_runs: 10
workers: 0
overrides:                          # dotted paths (a nested mapping would REPLACE the whole section)
  fidelity: 4                       # sensors on (truth + measured channels recorded)
  motor.ignition_delay_s: 1.0       # pad time before ignition (alignment / bias estimation window)
  rocket.inertia: {ixx_kgm2: 0.0001, iyy_kgm2: 0.0375}   # thin-tube estimate of the example airframe (about its dry CG)
  sensors.accelerometer.saturation: 400.0
  sensors.gps.rate_hz: 5.0
  sensors.gps.latency_s: 0.1
  simulation.dt_s: 0.01
  simulation.descent_dt_s: 0.05
  simulation.stop_after_apogee_s: 3.0   # ascent-focused
parameters:
  # --- vehicle (build tolerance; inertia follows mass) ---
  - {path: rocket.dry_mass_kg,                  dist: normal,      rel_std: 0.03}
  - {path: rocket.inertia.iyy_kgm2,             dist: linked,      ref: rocket.dry_mass_kg, exponent: 1.0, rel_std: 0.02}
  - {path: rocket.inertia.ixx_kgm2,             dist: linked,      ref: rocket.dry_mass_kg, exponent: 1.0, rel_std: 0.05}
  - {path: rocket.cg_from_nose_m,               dist: normal,      std: 0.006}
  - {path: rocket.aero.drag_scale,              dist: lognormal,   median: 1.0, sigma: 0.08}
  - {path: motor.thrust_scale,                  dist: truncnormal, mean: 1.0, std: 0.03, low: 0.9, high: 1.1}
  - {path: motor.misalignment_deg.0,            dist: normal,      mean: 0.0, std: 0.15}
  - {path: motor.misalignment_deg.1,            dist: normal,      mean: 0.0, std: 0.15}
  # --- launch / environment ---
  - {path: launch.elevation_deg,                dist: uniform,     low: 84, high: 90}
  - {path: environment.wind.model,              dist: choice,      values: [constant]}
  - {path: environment.wind.speed_ms,           dist: uniform,     low: 0, high: 6}
  - {path: environment.wind.direction_from_deg, dist: uniform,     low: 0, high: 360}
  - {path: environment.wind.turbulence_sigma_ms, dist: uniform,    low: 0, high: 1.5}
  - {path: environment.atmosphere.temperature_offset_k,   dist: normal, mean: 0, std: 8}
  - {path: environment.atmosphere.sea_level_pressure_pa,  dist: normal, mean: 101325, std: 600}
  # --- sensors (per-flight imperfections) ---
  - {path: sensors.accelerometer.noise_std,     dist: lognormal,   median: 0.03, sigma: 0.3}
  - {path: sensors.accelerometer.misalignment_std_deg, dist: uniform, low: 0.0, high: 0.5}
  - {path: sensors.gyroscope.bias_std,          dist: lognormal,   median: 0.002, sigma: 0.3}
  - {path: sensors.barometer.noise_std,         dist: lognormal,   median: 3.0, sigma: 0.3}
  - {path: sensors.gps.dropout_probability,     dist: uniform,     low: 0.0, high: 0.3}     # Bernoulli per fix
  - {path: sensors.gps.startup_delay_s,         dist: uniform,     low: 0.0, high: 3.0}
  - {path: sensors.gps.velocity_noise_std,      dist: lognormal,   median: 0.15, sigma: 0.3}
correlations:
  - paths: [environment.atmosphere.temperature_offset_k, environment.atmosphere.sea_level_pressure_pa]
    matrix: [[1.0, -0.4], [-0.4, 1.0]]          # warm air masses sit under lower pressure
  - paths: [environment.wind.speed_ms, environment.wind.turbulence_sigma_ms]
    matrix: [[1.0, 0.7], [0.7, 1.0]]            # stronger mean wind -> more turbulence
splits:
  train: {runs: 80}
  val:   {runs: 10}
  # shifted-distribution hold-out: stronger wind, heavier vehicles, lower launch angles than anything in training.
  # The split REPLACES the global parameter list, so every other parameter is repeated unchanged (otherwise it would
  # silently become nominal there and confound the comparison).
  test:
    runs: 10
    parameters:
      - {path: rocket.dry_mass_kg,                  dist: uniform,     low: 0.50, high: 0.56}
      - {path: rocket.inertia.iyy_kgm2,             dist: linked,      ref: rocket.dry_mass_kg, exponent: 1.0, rel_std: 0.02}
      - {path: rocket.inertia.ixx_kgm2,             dist: linked,      ref: rocket.dry_mass_kg, exponent: 1.0, rel_std: 0.05}
      - {path: rocket.cg_from_nose_m,               dist: normal,      std: 0.006}
      - {path: rocket.aero.drag_scale,              dist: lognormal,   median: 1.0, sigma: 0.08}
      - {path: motor.thrust_scale,                  dist: truncnormal, mean: 1.0, std: 0.03, low: 0.9, high: 1.1}
      - {path: motor.misalignment_deg.0,            dist: normal,      mean: 0.0, std: 0.15}
      - {path: motor.misalignment_deg.1,            dist: normal,      mean: 0.0, std: 0.15}
      - {path: launch.elevation_deg,                dist: uniform,     low: 80, high: 84}
      - {path: environment.wind.model,              dist: choice,      values: [constant]}
      - {path: environment.wind.speed_ms,           dist: uniform,     low: 6, high: 10}
      - {path: environment.wind.direction_from_deg, dist: uniform,     low: 0, high: 360}
      - {path: environment.wind.turbulence_sigma_ms, dist: uniform,    low: 0, high: 1.5}
      - {path: environment.atmosphere.temperature_offset_k,   dist: normal, mean: 0, std: 8}
      - {path: environment.atmosphere.sea_level_pressure_pa,  dist: normal, mean: 101325, std: 600}
      - {path: sensors.accelerometer.noise_std,     dist: lognormal,   median: 0.03, sigma: 0.3}
      - {path: sensors.accelerometer.misalignment_std_deg, dist: uniform, low: 0.0, high: 0.5}
      - {path: sensors.gyroscope.bias_std,          dist: lognormal,   median: 0.002, sigma: 0.3}
      - {path: sensors.barometer.noise_std,         dist: lognormal,   median: 3.0, sigma: 0.3}
      - {path: sensors.gps.dropout_probability,     dist: uniform,     low: 0.0, high: 0.3}     # Bernoulli per fix
      - {path: sensors.gps.startup_delay_s,         dist: uniform,     low: 0.0, high: 3.0}
      - {path: sensors.gps.velocity_noise_std,      dist: lognormal,   median: 0.15, sigma: 0.3}
dataset:
  kind: windowed
  sample_dt_s: 0.02
  trim: flight
  inputs:
    - {column: meas_accel_x}
    - {column: meas_accel_y}
    - {column: meas_accel_z}
    - {column: meas_gyro_x}
    - {column: meas_gyro_y}
    - {column: meas_gyro_z}
    - {column: meas_baro_pressure}
    - {derived: time_since_ignition}
  targets:
    - {column: vel_z}
  window: {history: 50, stride: 5, target: future, horizon_s: 0.5}
quality: {max_speed_ms: 3000, min_apogee_m: 10, require_landing: false, allowed_status: [ok, truncated]}
output_dir: output/dr-demo
