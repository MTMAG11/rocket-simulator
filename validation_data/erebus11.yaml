name: erebus11_euroc_2022
description: Erebus 11 (EuRoC 2022, Portugal), ProK54 solid motor, COTS altimeter
sim_config: erebus11_sim.yaml
source:
  name: Erebus team (EuRoC 2022) via RocketPy example data
  url: https://github.com/RocketPy-Team/RocketPy/tree/master/data/rockets/erebus11
  quality: "Tier 2: student team; COTS altimeter altitude filtered, 20 Hz; parameters from a secondary source (RocketPy notebook)"
  motor: ProK54 (thrust curve from RocketPy erebus11/thrust_source.csv; propellant mass from grain geometry)
  known_uncertainties: "wind, atmosphere temperature/pressure and exact launch angle are unmeasured; vonKarman nose approximated as ogive; fin thickness assumed; mass/inertia taken from the RocketPy notebook (team values, not independently verified)"
telemetry:
  file: raw/erebus11/flight_data_filtered.csv
  launch_threshold_altitude_m: 15
  landing_altitude_m: 5
  compare_landing: false
  channels:
    altitude: {time_column: t, column: alt, uncertainty: 3.0}
