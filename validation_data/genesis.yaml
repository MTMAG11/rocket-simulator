name: genesis_euroc_2023
description: Genesis (EuRoC 2023, Portugal), Cesaroni L995, team flight computer
sim_config: genesis_sim.yaml
source:
  name: Genesis team (EuRoC 2023) via RocketPy example data
  url: https://github.com/RocketPy-Team/RocketPy/tree/master/data/rockets/genesis
  quality: "Tier 2: student team flight computer, 100 Hz filtered altitude AGL; parameters from a secondary source (RocketPy notebook)"
  motor: Cesaroni 3618-L995 (ThrustCurve.org file bundled with RocketPy)
  known_uncertainties: "wind, atmosphere temperature/pressure and exact launch angle are unmeasured; vonKarman nose approximated as ogive; fin thickness assumed; mass/inertia taken from the RocketPy notebook (team values, not independently verified)"
telemetry:
  file: raw/genesis/flight_data_faraday.csv
  launch_threshold_altitude_m: 15
  landing_altitude_m: 5
  compare_landing: true
  channels:
    altitude: {time_column: ts, column: filtered_altitude_AGL, uncertainty: 2.0}
