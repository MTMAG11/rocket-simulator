name: cavour_euroc_2023
description: Cavour (Polito, EuRoC 2023, Portugal), Cesaroni L995, COTS altimeter
sim_config: cavour_sim.yaml
source:
  name: Polito team (EuRoC 2023) via RocketPy example data
  url: https://github.com/RocketPy-Team/RocketPy/tree/master/data/rockets/polito
  quality: "Tier 2: student team; altimeter altitude and velocity, ~6 Hz; parameters from a secondary source (RocketPy notebook)"
  motor: Cesaroni 3618-L995 (ThrustCurve.org file bundled with RocketPy)
  known_uncertainties: "wind, atmosphere temperature/pressure and exact launch angle are unmeasured; vonKarman nose approximated as ogive; fin thickness assumed; mass/inertia taken from the RocketPy notebook (team values, not independently verified)"
telemetry:
  file: raw/polito/altimeter_cavour.csv
  launch_threshold_altitude_m: 15
  landing_altitude_m: 5
  compare_landing: false
  channels:
    altitude: {time_column: ts, column: "altitude[m]", uncertainty: 3.0}
