# EPFL Rocket Team "Bella Lui", Kaltbrunn mission, 22 Feb 2020. Inputs reconstructed from the
# team parameters published in the RocketPy example notebook (bella_lui_flight_sim.ipynb).
# ASSUMPTIONS / KNOWN GAPS (see docs/validation.md): fin thickness (4 mm) and fin sweep
# (root-tip chord difference, RocketPy default) assumed; boat-tail (156->135 mm over 50 mm) NOT
# modelled; published inertias (Iyy 0.78 kg m^2) are implausible for a 2.7 m / 19.6 kg vehicle,
# so a thin-tube estimate is used; atmosphere = ISA with a climatological temperature
# offset (ERA5 profile not available) -- an INPUT uncertainty, not a tuning knob.
config_version: 1
name: bella_lui_sim
fidelity: 3
simulation: {dt_s: 0.005, descent_dt_s: 0.05, t_max_s: 400}
rocket:
  name: Bella Lui
  body_diameter_m: 0.156
  body_length_m: 2.6776
  nose: {shape: ogive, length_m: 0.242}
  fins: {count: 3, root_chord_m: 0.280, tip_chord_m: 0.125, span_m: 0.200, sweep_m: 0.155, thickness_m: 0.004, position_from_nose_m: 2.292}
  # liftoff mass 19.600 kg (RocketPy: 18.226 + 0.001 + 1.373 propellant); motor hardware
  # (0.805 kg) is counted separately by the motor model, so airframe = 19.600 - 2.255
  dry_mass_kg: 17.345
  cg_from_nose_m: 1.503      # makes (airframe + casing) CG = 1.542 m from the nose tip
  motor_aft_from_nose_m: 2.6776
  parachutes:
    - {cd: 1.0, diameter_m: 1.0, trigger: apogee, delay_s: 1.0, inflation_time_s: 0.5}   # CdS = pi/4 m^2
motor: {file: raw/AeroTech_K828FJ.eng}
environment:
  atmosphere: {model: isa, temperature_offset_k: -8.0}
  gravity: {model: inverse_square}
  wind: {model: constant, speed_ms: 1.0, direction_from_deg: 0.0}
  site_elevation_msl_m: 407.0
launch: {elevation_deg: 89.0, azimuth_deg: 45.0, rail_length_m: 4.2}
